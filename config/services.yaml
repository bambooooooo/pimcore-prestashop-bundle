services:
    _defaults:
        autowire: true
        autoconfigure: true

    Bnix\PimcorePrestashopBundle\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Enum/'

    _instanceof:
        Bnix\PimcorePrestashopBundle\Mapping\MapperInterface:
            tags:
                - 'bnix.pimcore_prestashop.field_mapper'

    Bnix\PimcorePrestashopBundle\Registry\MapperRegistry:
        arguments:
            $mappers: !tagged_iterator { tag: bnix.pimcore_prestashop.field_mapper, exclude: ['Bnix\PimcorePrestashopBundle\Mapping\Mappers\LiteralFieldMapper'] }
